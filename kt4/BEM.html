<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>BEM Example</title>
    <style>
      /* Блоки */
      .card {
        width: 300px;
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-family: Arial, sans-serif;
      }

      /* Элементы */
      .card__title {
        font-size: 20px;
        margin-bottom: 8px;
      }

      .card__description {
        font-size: 14px;
        margin-bottom: 12px;
        color: #555;
      }

      .card__button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Модификаторы */
      .card__button--primary {
        background-color: #007bff;
        color: white;
      }

      .card__button--secondary {
        background-color: #eee;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card__title">Заголовок карточки</div>
      <div class="card__description">
        Небольшое описание карточки с использованием БЭМ.
      </div>
      <button class="card__button card__button--primary">Основная</button>
      <button class="card__button card__button--secondary">Вторичная</button>
    </div>
  </body>
</html>
